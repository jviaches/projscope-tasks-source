<div class="center" style="width: 600px">
  <div style="padding-bottom: 20px">
    <h1>
      <div>
        <span>Task Details</span>
        <span *ngIf="taskId !== 0"> - #{{taskId}}</span>
      </div>
    </h1>
  </div>

  <input [(ngModel)]="caption" class="input" type="text" placeholder="Caption" style="margin-bottom: 5px"/>

  <form style="display: flex; justify-content: space-between">
    <mat-form-field appearance="legacy" style="width: 48%">
      <mat-label>Priority</mat-label>
      <mat-select [(ngModel)]="selectedPriority" name="priority">
        <mat-option *ngFor="let priority of utilsService.priorities" [value]="priority"
                    [ngStyle]="{'border-color': this.utilsService.getColorByPriority(priority.viewValue)}"
                    class="task-priority">
          {{ priority.viewValue }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="legacy" style="width: 48%">
      <mat-label>Section</mat-label>
      <mat-select [(ngModel)]="selectedSection" name="section">
        <mat-option *ngFor="let section of utilsService.sections" [value]="section">
          {{ section.viewValue }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <mat-form-field appearance="legacy" class="example-full-width" style="width: 100%; margin-bottom: 4px;">
    <mat-label>Deadline (optional)</mat-label>
    <input matInput type="datetime-local" [(ngModel)]="dueDate" name="dueDate" />
    <button matSuffix mat-icon-button *ngIf="dueDate" (click)="dueDate = ''" type="button" aria-label="Clear deadline">
      <mat-icon>clear</mat-icon>
    </button>
  </mat-form-field>

  <div class="tags-section" *ngIf="availableTags.length > 0">
    <label class="tags-label">Tags</label>
    <mat-chip-list class="tags-chip-list">
      <mat-chip *ngFor="let tag of availableTags"
                [class.tag-selected]="isTagSelected(tag)"
                [style.background-color]="isTagSelected(tag) ? tag.color : null"
                (click)="toggleTag(tag)">
        {{ tag.name }}
      </mat-chip>
    </mat-chip-list>
  </div>

  <quill-editor id="editor" [styles]="editorStyle" [modules]="quillConfiguration" [(ngModel)]="editorText"
                (onContentChanged)="onContentChanged($event)" required></quill-editor>

  <div style="margin-top: 20px">
    <button mat-raised-button (click)="updateTask()" style="margin-right: 10px" [disabled]="caption === ''">
      Update
    </button>
    <button mat-raised-button (click)="cancel()">Cancel</button>
  </div>
</div>
