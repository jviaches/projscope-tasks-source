<div class="welcome-root" [class.dark]="isDarkTheme">
  <div class="welcome-card">

    <!-- ── Header ──────────────────────────────────────────────────────── -->
    <div class="welcome-header">
      <div class="welcome-logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="9" fill="#6E56CF"/>
          <rect x="9"  y="10" width="4" height="16" rx="1" fill="white"/>
          <rect x="16" y="10" width="4" height="11" rx="1" fill="white" opacity="0.85"/>
          <rect x="23" y="10" width="4" height="7"  rx="1" fill="white" opacity="0.65"/>
        </svg>
      </div>
      <div class="welcome-titles">
        <span class="welcome-app-name">ProjScope Tasks</span>
        <span class="welcome-tagline">Kanban project management</span>
      </div>
      <div class="welcome-version-badge">v{{ version }}</div>
    </div>

    <!-- ── Action tiles ─────────────────────────────────────────────────── -->
    <div class="welcome-actions">

      <button class="tile" (click)="newProject()">
        <div class="tile-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9"  y1="15" x2="15" y2="15"/>
          </svg>
        </div>
        <span class="tile-label">New Project</span>
        <span class="tile-hint">Start from scratch</span>
      </button>

      <button class="tile" (click)="loadProject()">
        <div class="tile-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="tile-label">Open Project</span>
        <span class="tile-hint">Load a .prj file</span>
      </button>

      <button class="tile tile--exit" (click)="exitProject()">
        <div class="tile-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8"  x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <span class="tile-label">Exit</span>
        <span class="tile-hint">Close ProjScope</span>
      </button>

    </div>

    <!-- ── Recent files ─────────────────────────────────────────────────── -->
    <div class="welcome-recent" *ngIf="recentProjects.length > 0">
      <div class="recent-heading">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Recent
      </div>
      <div class="recent-list">
        <button class="recent-item" *ngFor="let r of recentProjects" (click)="openRecent(r.path)">
          <div class="recent-item-left">
            <span class="recent-name">{{ r.name }}</span>
            <span class="recent-path" [title]="r.path">{{ r.path }}</span>
          </div>
          <div class="recent-item-right">
            <span class="recent-tasks">{{ r.taskCount }} task{{ r.taskCount !== 1 ? 's' : '' }}</span>
            <span class="recent-date">{{ r.openedAt | date:'MMM d' }}</span>
          </div>
        </button>
      </div>
    </div>

    <!-- ── Support strip ────────────────────────────────────────────────── -->
    <div class="welcome-support">
      <button class="support-btn" (click)="openGitHub()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        GitHub
      </button>
      <button class="support-btn" (click)="openCoffee()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
          <line x1="6" y1="1" x2="6"  y2="4"/>
          <line x1="10" y1="1" x2="10" y2="4"/>
          <line x1="14" y1="1" x2="14" y2="4"/>
        </svg>
        Buy Me a Coffee
      </button>
    </div>

  </div>
</div>
