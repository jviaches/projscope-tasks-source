<router-outlet></router-outlet>

<div id="update-toast" class="update-toast hidden">
  <div class="update-toast__icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
    </svg>
  </div>
  <div class="update-toast__body">
    <span class="update-toast__title">Update {{ updateName }} ready</span>
    <span class="update-toast__sub">Restart to apply the update</span>
  </div>
  <div class="update-toast__actions">
    <button class="update-toast__btn update-toast__btn--primary" (click)="restartApp()">Restart</button>
    <button class="update-toast__btn update-toast__btn--ghost" (click)="closeNotification()">Later</button>
  </div>
</div>
