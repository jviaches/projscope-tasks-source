name: Build & publish Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v2.2.1)'
        required: true
        default: 'v2.2.1'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot dpkg

      - name: Build Angular + compile Electron main process
        run: npm run build:prod

      - name: Build Linux packages (AppImage, deb, rpm)
        run: npx electron-builder build --linux --publish never

      - name: List built artifacts
        run: ls -lh release/*.AppImage release/*.deb release/*.rpm 2>/dev/null || true

      - name: Upload Linux packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            source/release/*.AppImage
            source/release/*.deb
            source/release/*.rpm
