name: Build & publish Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular + compile Electron main process
        run: npm run build:prod

      - name: Build Linux AppImage (no auto-publish)
        run: npx electron-builder build --linux --publish never

      - name: Upload AppImage to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          FILE=$(ls release/*.AppImage)
          NAME=$(basename "$FILE")

          # Get release id for the tag
          RELEASE_ID=$(curl -sf \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "Uploading $NAME to release $RELEASE_ID ($TAG)"

          curl -sf -X POST \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$NAME" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$FILE"

          echo "Done."
