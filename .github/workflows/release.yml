  # ── Linux build → AppImage ───────────────────────────────────────────────
  release-linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Build Angular app + compile main.ts
        run: npm run build:prod

      - name: Package and publish
        run: npm run deploy:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed by electron-builder on headless Linux runners
          DISPLAY: ':99.0'
