name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Windows → NSIS installer (x64 + ia32) + portable (x64) ─────────────
  release-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular app + compile main.ts
        run: npm run build:prod

      - name: Verify build artifacts
        run: |
          if (!(Test-Path "main.js"))  { Write-Error "main.js missing"; exit 1 }
          if (!(Test-Path "dist"))     { Write-Error "dist/ missing";   exit 1 }
          Write-Host "Build artifacts OK"

      - name: Package Windows (no auto-publish)
        run: npx electron-builder build --win --publish never

      - name: Upload Windows installers to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: source/release/Projscope*.exe

  # ── Linux → AppImage ─────────────────────────────────────────────────────
  # Runs after Windows so the release already exists when we upload
  release-linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: release-windows
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot

      - name: Build Angular app + compile main.ts
        run: npm run build:prod

      - name: Verify build artifacts
        run: |
          test -f main.js || (echo "main.js missing" && exit 1)
          test -d dist    || (echo "dist/ missing"   && exit 1)
          echo "Build artifacts OK"

      - name: Package Linux (no auto-publish)
        run: npx electron-builder build --linux --publish never

      - name: Upload Linux AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: source/release/**/*.AppImage
