name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Allow manual re-trigger from the Actions tab (pick any tag/branch)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # ── Windows build → NSIS installer (x64 + ia32) + portable ──────────────
  release-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular app + compile main.ts
        run: npm run build:prod

      - name: Package and publish
        run: npm run deploy:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux build → AppImage ───────────────────────────────────────────────
  # Runs AFTER Windows so both jobs don't race to create the same release
  release-linux:
    name: Linux
    runs-on: ubuntu-latest
    needs: release-windows
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot

      - name: Build Angular app + compile main.ts
        run: npm run build:prod

      - name: Package and publish
        run: npm run deploy:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
