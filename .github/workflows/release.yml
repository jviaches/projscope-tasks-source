name: Release

# Triggers when a version tag is pushed: git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # ── Windows build → NSIS installer (x64 + ia32) ─────────────────────────
  release-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular app + compile main.ts
        run: npm run build:prod

      - name: Package and publish
        run: npm run deploy:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS build → dmg + standalone zip ──────────────────────────────────
